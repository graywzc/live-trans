name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Validate Homebrew tap token
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::error::Set HOMEBREW_TAP_TOKEN so releases can open the matching Homebrew tap PR."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # The runner has no signing certificate, so the app is signed ad hoc. The
      # cask re-signs it on install anyway, to clear the quarantine flag.
      - name: Test
        run: |
          xcodebuild test -project LiveTrans.xcodeproj -scheme LiveTrans \
            -destination platform=macOS -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Build app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild build -project LiveTrans.xcodeproj -scheme LiveTrans \
            -configuration Release -destination platform=macOS -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            MARKETING_VERSION="${VERSION}" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"

      - name: Package app
        id: package
        working-directory: DerivedData/Build/Products/Release
        run: |
          ditto -c -k --keepParent LiveTrans.app LiveTrans.zip
          sha256="$(shasum -a 256 LiveTrans.zip | awk '{print $1}')"
          echo "${sha256}  LiveTrans.zip"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: DerivedData/Build/Products/Release/LiveTrans.zip
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: graywzc/homebrew-tap
          path: homebrew-tap
          token: ${{ env.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew cask
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          brew tap graywzc/tap "${PWD}"
          # brew audit refuses to load casks from a third-party tap until the
          # tap is trusted; brew style and plain installs don't need this.
          brew trust graywzc/tap
          cask="Casks/livetrans.rb"
          perl -pi -e "s|version \"[^\"]+\"|version \"${VERSION}\"|g" "${cask}"
          perl -pi -e "s|sha256 \"[a-f0-9]+\"|sha256 \"${SHA256}\"|g" "${cask}"
          brew style "${cask}"
          brew audit --cask livetrans

      - name: Open Homebrew cask PR
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          branch="livetrans-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${branch}"
          git add Casks/livetrans.rb

          if git diff --cached --quiet; then
            echo "Cask already points to livetrans ${VERSION}."
            exit 0
          fi

          git commit -m "Update livetrans to ${VERSION}"
          git push --force-with-lease origin "${branch}"

          title="Update livetrans to ${VERSION}"
          body="Updates livetrans to the v${VERSION} macOS release asset.

          Release: https://github.com/graywzc/live-trans/releases/tag/v${VERSION}
          SHA256: ${SHA256}"

          if gh pr view "${branch}" --repo graywzc/homebrew-tap >/dev/null 2>&1; then
            gh pr edit "${branch}" --repo graywzc/homebrew-tap --title "${title}" --body "${body}"
          else
            gh pr create --repo graywzc/homebrew-tap --base main --head "${branch}" --title "${title}" --body "${body}"
          fi
