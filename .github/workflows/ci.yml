name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and test
        env:
          # The GUI tests draw their windows to PNGs here.
          TEST_RUNNER_SNAPSHOT_DIR: ${{ runner.temp }}/snapshots
        run: |
          mkdir -p "${TEST_RUNNER_SNAPSHOT_DIR}"
          xcodebuild test -project LiveTrans.xcodeproj -scheme LiveTrans \
            -destination platform=macOS -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Build and test the iPhone app
        env:
          # The phone's tests render their views to PNGs here, for a look:
          # the simulator cannot be run from a session on the Mac.
          TEST_RUNNER_SNAPSHOT_DIR: ${{ runner.temp }}/phone-snapshots
        run: |
          mkdir -p "${TEST_RUNNER_SNAPSHOT_DIR}"
          xcrun simctl list devices available | grep -i iphone
          xcodebuild test -project LiveTrans.xcodeproj -scheme LiveTransMobile \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Upload GUI snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-snapshots
          path: ${{ runner.temp }}/snapshots

      - name: Upload iPhone snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-snapshots
          path: ${{ runner.temp }}/phone-snapshots
          if-no-files-found: ignore
