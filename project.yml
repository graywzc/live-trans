name: LiveTrans
options:
  bundleIdPrefix: com.larrywang.livetrans
  deploymentTarget:
    macOS: "14.0"
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: "3436H9LR76"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LiveTrans:
    type: application
    platform: macOS
    sources:
      # The phone's own files are under Sources/iOS; what both apps share
      # is under Sources/Shared, which is inside Sources.
      - path: Sources
        excludes: ["iOS/**"]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: LiveTrans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSMicrophoneUsageDescription: LiveTrans listens to the selected audio input so it can caption and translate Japanese speech.
        NSAppleEventsUsageDescription: LiveTrans plays, pauses and skips the video in Chrome when you use its video buttons.
        NSBluetoothAlwaysUsageDescription: LiveTrans lists your paired AirPods and headphones in its sound output menu and connects the one you choose.
        # The GPU server speaks plain HTTP over Tailscale; without this App
        # Transport Security would only permit HTTPS.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.larrywang.livetrans
        PRODUCT_NAME: LiveTrans
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # No sandbox: the app starts the GPU server by running ssh, which a
        # sandboxed app cannot.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
  LiveTransTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes: ["iOS/**"]
    dependencies:
      - target: LiveTrans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.larrywang.livetrans.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LiveTrans.app/Contents/MacOS/LiveTrans"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # The iPhone companion: the Mac's captions and video, kept on the GPU host
  # as a bundle, fetched over the tailnet and watched on the phone.
  LiveTransMobile:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
    info:
      path: Sources/iOS/Info.plist
      properties:
        CFBundleDisplayName: LiveTrans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The video keeps playing with the screen off.
        UIBackgroundModes: [audio]
        # The LLM that analyzes sentences speaks plain HTTP over the
        # tailnet; the bundles come over HTTPS and need no exception.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.larrywang.livetrans.ios
        PRODUCT_NAME: LiveTrans
        PRODUCT_MODULE_NAME: LiveTransMobile
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/iOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  LiveTransMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/iOS
    dependencies:
      - target: LiveTransMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.larrywang.livetrans.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LiveTrans.app/LiveTrans"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  LiveTrans:
    build:
      targets:
        LiveTrans: all
        LiveTransTests: [test]
    test:
      targets:
        - LiveTransTests
  LiveTransMobile:
    build:
      targets:
        LiveTransMobile: all
        LiveTransMobileTests: [test]
    test:
      targets:
        - LiveTransMobileTests
